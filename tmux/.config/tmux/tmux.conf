unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-b
set -g base-index 1
set -g pane-base-index 1
set -g extended-keys on
set -g extended-keys-format csi-u

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

set -g default-terminal "xterm-ghostty"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",*256col*:RGB"

set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
set -g aggressive-resize on

# theme
source-file ~/.config/tmux/themes/kanagawa-wave.conf

# pi session headers. The pi extension ~/work/agent-config/extensions/tmux-title.ts sets the terminal
# title to "▶ <task> · <dir>" (▶ working, ■ idle, ⚠ last run errored); tmux shows it as #{pane_title}.
# Header above every pane only; window names are left alone (tmux's default automatic naming).
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
