# palette
%hidden KW_BG="#1f1f28"
%hidden KW_BG_DARK="#16161d"
%hidden KW_BG_LINE="#363646"
%hidden KW_SEL="#2d4f67"
%hidden KW_FG="#dcd7ba"
%hidden KW_FG_DIM="#c8c093"
%hidden KW_GRAY="#727169"
%hidden KW_BLUE="#7e9cd8"
%hidden KW_AQUA="#7aa89f"
%hidden KW_GREEN="#98bb6c"
%hidden KW_YELLOW="#e6c384"
%hidden KW_ORANGE="#ff9e3b"
%hidden KW_RED="#e82424"
%hidden KW_VIOLET="#957fb8"
%hidden KW_ACCENT="#{?client_prefix,${KW_ORANGE},#{?pane_in_mode,${KW_GREEN},${KW_BLUE}}}"

# separators
%hidden KW_SEP_R="" # ue0b1
%hidden KW_SEP_L="" # ue0b3

# glyphs
%hidden KW_ICON_SESSION="" # uf120
%hidden KW_ICON_DIR="" # uf07b
%hidden KW_ICON_CLOCK="" # uf017
%hidden KW_ICON_HOST="" # uf108
%hidden KW_DATE="" # uf073
%hidden KW_ICON_ZOOM="" # uf00e
%hidden KW_MAKR_LAST="·" # u00b7

# status bar
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=${KW_FG},bg=${KW_BG}"
set -g status-left-length 60
set -g status-right-length 120

set -g status-left "\
#[fg=${KW_BG_DARK},bg=${KW_ACCENT},bold] ${KW_ICON_SESSION} #S \
#[fg=${KW_ACCENT},bg=${KW_BG},nobold]${KW_SEP_R} "

set -g status-right "\
#[fg=${KW_BG_LINE},bg=${KW_BG}]${KW_SEP_L}\
#[fg=${KW_FG_DIM},bg=${KW_BG_LINE}] ${KW_ICON_DIR} #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}} \
#[fg=${KW_BLUE},bg=${KW_BG_LINE}]${KW_SEP_L}\
#[fg=${KW_SEL},bg=${KW_BG_LINE}]${KW_SEP_L}#[fg=${KW_FG},bg=${KW_SEL}] ${KW_ICON_HOST} #h \
#[fg=${KW_SEL},bg=${KW_BG_LINE}]${KW_SEP_L}#[fg=${KW_FG},bg=${KW_SEL}] ${KW_ICON_DATE} %a %d %b \
#[fg=${KW_BG_DARK},bg=${KW_BLUE},bold] ${KW_ICON_CLOCK} %H:%M "

# window list
set -g window-status-separator ""

set -g window-status-format "\
#[fg=${KW_SEL},bg=${KW_BG}]${KW_SEP_L}\
#[fg=${KW_FG},bg=${KW_SEL},bold] #I #W#{?window_zoomed_flag, ${KW_ICON_ZOOM},} \
#[fg=${KW_SEL},bg=${KW_BG},nobold]${KW_SEP_R}"

set -g window-status-activity-style "fg=${KW_YELLOW},bg=${KW_BG}"
set -g window-status-bell-style "fg=${KW_RED},bg=${KW_BG},bold"

# panes
set -g pane-border-style "fg=${KW_BG_LINE}"
set -g pane-active-border-style "fg=${KW_BLUE}"
set -g pane-border-indicators colour
set -g display-panes-colour "${KW_GRAY}"
set -g display-panes-active-colour "${KW_BLUE}"

# pane titles (enabled via set -g pane-border-status top)
set -g pane-border-format "#[fg=#{?pane_active,${KW_BLUE},${KW_GRAY}}]#P #{pane_current_command} "

# messages and prompts
set -g message-style "fg=${KW_BG_DARK},bg=${KW_YELLOW},bold"
set -g message-command-style "fg=${KW_YELLOW},bg=${KW_BG_LINE},bold"

# copy mode / search
set -g mode-style "fg=${KW_FG_DIM},bg=${KW_SEL},bold"
set -g copy-mode-match-style "fg=${KW_BG_DARK},bg=${KW_YELLOW}"
set -g copy-mode-current-match-style "fg=${KW_BG_DARK},bg=${KW_ORANGE},bold"
set -g copy-mode-mark-style "fg=${KW_BG_DARK},bg=${KW_AQUA}"

# clock
set -g clock-mode-colour "${KW_BLUE}"
set -g clock-mode-style 24

# menus & popups
set -g menu-style "fg=${KW_FG},bg=${KW_BG}"
set -g menu-selected-style "fg=${KW_BG_DARK},bg=${KW_BLUE},bold"
set -g menu-border-style "fg=${KW_BG_LINE}"
set -g popup-style "fg=${KW_FG},bg=${KW_BG}"
set -g popup-border-style "fg=${KW_BG_LINE}"
